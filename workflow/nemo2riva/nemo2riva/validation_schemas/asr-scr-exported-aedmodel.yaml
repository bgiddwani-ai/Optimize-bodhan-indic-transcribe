# Define required metadata fields expected in the archive (optional).
metadata:
  - obj_cls: nemo.collections.asr.models.EncDecMultiTaskModel


# Define list of files that are expected (optional).
artifact_properties:
  # List of files.
  - model_config.yaml
  - encoder.onnx:
      export_subnet: encoder
      onnx: True
  - decoder.pt:
      export_subnet: transf_decoder
      states_only: True
      torch: True
      onnx: False
  - log_softmax.pt:
      export_subnet: log_softmax
      states_only: True
      torch: True
      onnx: False
  # PATCH: emit the encoder->decoder projection module (nn.Linear or nn.Identity).
  # servicemaker/triton/trtllm_canary.py requires encoder_decoder_proj.pt to be
  # packaged in the .riva. For your model the projection is nn.Identity, so
  # state_dict() is empty and the file is a few hundred bytes; the consumer
  # branches on len(proj_state_dict) > 0 to decide whether to fuse a Linear
  # FC into the encoder or just append a transpose.
  - encoder_decoder_proj.pt:
      export_subnet: encoder_decoder_proj
      states_only: True
      torch: True
      onnx: False


# Define list of files with expected content (optional).
# Functionality limited to yaml files (e.g. model_config.yaml).
artifact_content:
  # List of files.
  - model_config.yaml:
    # List of sections.subsections. ... that are required.
    # (Optional `: True` instructs to check the presence of the file in indicated as leaf in the archive)
    - transf_decoder
    - transf_encoder
    - vocabulary
    - num_classes
    - feat_in
    - n_layers
    - target
    - beam_search
    - encoder
    - head
    - model_defaults
    - prompt_format
    - sample_rate
    - target
    - preprocessor